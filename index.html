<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ガーベラ - IRIAM配信おたすけツール</title>
<meta name="theme-color" content="#D98CA6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ガーベラ">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23E8B4C8'%3E%3Cellipse cx='16' cy='6' rx='4' ry='7'/%3E%3Cellipse cx='16' cy='26' rx='4' ry='7'/%3E%3Cellipse cx='6' cy='16' rx='7' ry='4'/%3E%3Cellipse cx='26' cy='16' rx='7' ry='4'/%3E%3Cellipse cx='9' cy='9' rx='4.5' ry='6' transform='rotate(-45 9 9)'/%3E%3Cellipse cx='23' cy='9' rx='4.5' ry='6' transform='rotate(45 23 9)'/%3E%3Cellipse cx='9' cy='23' rx='4.5' ry='6' transform='rotate(45 9 23)'/%3E%3Cellipse cx='23' cy='23' rx='4.5' ry='6' transform='rotate(-45 23 23)'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23C06F8D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  /* ダークモードのちらつき防止：本体スクリプト読み込み前にテーマだけ当てる */
  try {
    var s = JSON.parse(localStorage.getItem('gerbera:settings') || '{}');
    document.documentElement.dataset.theme = s.dark ? 'dark' : 'light';
    if (s.reduceMotion) document.documentElement.classList.add('reduce-motion');
  } catch (e) {}
</script>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <button id="backBtn" class="header-back" hidden aria-label="トップへ戻る">‹</button>
    <a class="brand" href="#" aria-label="ガーベラ トップへ">
      <svg class="brand-mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g fill="#E8B4C8">
          <ellipse cx="16" cy="6" rx="4" ry="7"/><ellipse cx="16" cy="26" rx="4" ry="7"/>
          <ellipse cx="6" cy="16" rx="7" ry="4"/><ellipse cx="26" cy="16" rx="7" ry="4"/>
          <ellipse cx="9" cy="9" rx="4.5" ry="6" transform="rotate(-45 9 9)"/>
          <ellipse cx="23" cy="9" rx="4.5" ry="6" transform="rotate(45 23 9)"/>
          <ellipse cx="9" cy="23" rx="4.5" ry="6" transform="rotate(45 9 23)"/>
          <ellipse cx="23" cy="23" rx="4.5" ry="6" transform="rotate(-45 23 23)"/>
        </g>
        <circle cx="16" cy="16" r="5.5" fill="#C06F8D"/>
      </svg>
      <span class="brand-title">ガーベラ</span>
    </a>
  </div>
  <button id="menuBtn" class="header-menu-btn" aria-label="メニューを開く" aria-expanded="false">☰</button>
</header>
<div id="menuBackdrop" class="header-menu-backdrop" hidden></div>
<nav id="headerMenu" class="header-menu" aria-label="メニュー" hidden>
  <button id="announceBtn" class="header-menu-item">📣　おしらせ</button>
  <button id="contactBtn" class="header-menu-item">✉️　お問い合わせ</button>
  <button id="settingsBtn" class="header-menu-item">⚙️　設定</button>
  <button id="mypageBtn" class="header-menu-item">👤　マイページ</button>
</nav>

<main id="view"></main>

<div id="sheetBackdrop" class="sheet-backdrop" hidden></div>
<section id="sheet" class="sheet" hidden aria-modal="true" role="dialog">
  <div class="sheet-grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <span id="sheetIcon" class="sheet-icon" aria-hidden="true"></span>
    <span id="sheetTitle" class="sheet-title"></span>
    <button id="sheetClose" class="sheet-close" aria-label="閉じる">×</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</section>

<nav id="bottomNav" class="bottom-nav" aria-label="共通ツール"></nav>

<div id="toast" class="toast" role="status"></div>

<script src="js/core.js"></script>
<script src="js/settings.js"></script>
<script src="js/anim.js"></script>
<script src="js/die3d.js"></script>
<script src="js/die4.js"></script>
<script src="js/data.js"></script>
<script src="js/announcements.js"></script>
<script src="js/tools/announce.js"></script>
<script src="js/tools/dice.js"></script>

<script src="js/tools/roulette.js"></script>

<script src="js/app.js"></script>
</body>
</html>
